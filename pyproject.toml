[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blast-radius"
version = "0.1.0"
description = "Deterministic impact analysis for Python: what breaks if I change this symbol?"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shubham Jain", email = "jainshubham37@gmail.com" }]
keywords = [
    "static-analysis",
    "impact-analysis",
    "call-graph",
    "refactoring",
    "ast",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# No runtime dependencies on purpose. Parsing is stdlib `ast`, which is exact
# for Python and cannot drift from the language the way a third-party grammar
# can. Anything that needs a dependency belongs behind an optional extra.
dependencies = []

[project.urls]
Homepage = "https://github.com/ShubhJ46/blast-radius"
Repository = "https://github.com/ShubhJ46/blast-radius"
Issues = "https://github.com/ShubhJ46/blast-radius/issues"

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.12.10",
    "mcp>=2.0.0",
]
# The MCP server is the one part that needs a dependency, so it is the one part
# behind an extra. `import blastradius` still pulls in nothing.
mcp = ["mcp>=2.0.0"]

[project.scripts]
blast = "blastradius.cli:main"
blast-mcp = "blastradius.mcp_server:main"

[tool.setuptools.packages.find]
include = ["blastradius*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# `evaluation` is included deliberately. It is not shipped, but the reported
# precision and recall are only as trustworthy as the code that decides which
# commits become cases, so it is held to the same bar as the library.
source = ["blastradius", "evaluation"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C901"]

[tool.ruff.lint.mccabe]
# Cyclomatic complexity, as a pointer to where to hand-probe rather than a
# quality score. Every defect found in this project so far has been in code at
# 100% coverage with clean lint -- a wrong assumption about which key is unique,
# not a tangled branch -- so this is not expected to catch bugs. It is set at 15
# because the codebase clusters at 13-14 and the two functions that did host
# recent bugs were the two most complex, which makes it a fair place to look
# first. An AST visitor is branchy by nature; a number here is a question, not a
# verdict.
max-complexity = 15
